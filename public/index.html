<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Migu API Enhanced — 咪咕音乐 API</title>
<style>
    :root {
        --accent: #6366f1;
        --text: #1e293b;
        --muted: #64748b;
        --border: #e2e8f0;
        --bg: #f8fafc;
        --card: #ffffff;
        --ok: #16a34a;
        --err: #dc2626;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
    }
    .wrap { max-width: 960px; margin: 0 auto; padding: 0 20px; flex: 1; }
    header { text-align: center; padding: 56px 0 32px; }
    .logo {
        display: inline-flex; align-items: center; justify-content: center;
        width: 64px; height: 64px; border-radius: 18px;
        background: var(--accent); color: #fff; font-size: 32px;
        margin-bottom: 16px;
    }
    h1 { font-size: 30px; letter-spacing: .5px; }
    h1 span { color: var(--accent); }
    .tagline { color: var(--muted); margin-top: 8px; font-size: 16px; }
    .status {
        display: inline-flex; align-items: center; gap: 8px;
        margin-top: 18px; padding: 6px 14px; border-radius: 999px;
        background: var(--card); border: 1px solid var(--border);
        font-size: 14px; color: var(--muted);
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #cbd5e1; }
    .dot.ok { background: var(--ok); }
    .dot.err { background: var(--err); }
    footer {
        margin-top: 44px; padding: 24px 20px 32px;
        text-align: center; color: var(--muted); font-size: 13px;
    }
    footer a { color: var(--muted); }
    @media (max-width: 600px) {
        h1 { font-size: 24px; }
    }
</style>
</head>
<body>
<div class="wrap">
    <header>
        <div class="logo">♪</div>
        <h1>Migu API <span>Enhanced</span></h1>
        <p class="tagline">基于 Hono 的咪咕音乐 API 服务 · 130+ 接口 · 搜索 / 歌单 / 歌词 / 播放地址</p>
        <div class="status"><span class="dot" id="statusDot"></span><span id="statusText">正在检查运行状态…</span></div>
    </header>
</div>
<footer>
    <p>仅供学习和研究使用，不得用于商业用途。本项目与咪咕音乐官方无任何关联，音视频资源版权归咪咕音乐所有，请支持正版。</p>
    <p style="margin-top:6px">Migu API Enhanced · 部署于 EdgeOne</p>
</footer>
<script>
    // 预览部署可能带 eo_token 之类的查询参数，API 请求也带上它才能访问
    var qs = location.search || '';
    function api(path) { return path + (qs ? (path.indexOf('?') >= 0 ? '&' : '?') + qs.slice(1) : ''); }

    fetch(api('/migu/status'))
        .then(function (r) { return r.json(); })
        .then(function (d) {
            var dot = document.getElementById('statusDot');
            var txt = document.getElementById('statusText');
            dot.classList.add('ok');
            txt.textContent = '运行中 · v' + (d.version || '?') + ' · ' + (d.runtime || '') + (d.dbEnabled ? ' · 数据库已启用' : ' · 数据库未启用');
        })
        .catch(function () {
            var dot = document.getElementById('statusDot');
            var txt = document.getElementById('statusText');
            dot.classList.add('err');
            txt.textContent = '状态检查失败，请稍后重试';
        });
</script>
</body>
</html>
